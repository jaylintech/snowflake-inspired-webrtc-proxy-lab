version: "2"

linters:
  default: standard
  enable:
    - staticcheck
    - unused
    - ineffassign
    - errcheck

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/jaylintech/snowflake-inspired-webrtc-proxy-lab

run:
  timeout: 3m
